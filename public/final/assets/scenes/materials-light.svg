73.68" font-size="13" font-weight="500" fill="#4b4fd6" text-anchor="middle">岗位 JD</text><rect x="526" y="530" width="402" height="74" rx="12" fill="#ffffff" stroke="#e1e5ee" /><g transform="translate(542 554) scale(1)" fill="none" stroke="#5d6680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="578" y="562" font-size="17" font-weight="600" fill="#16171b" >字节后端面经合集.md</text><text x="578" y="587" font-size="14" font-weight="400" fill="#8a92a8" >Markdown · 46 题</text><rect x="858" y="542" width="56" height="26" rx="13" fill="#e9eaff" stroke="none" /><text x="886" y="559.68" font-size="13" font-weight="500" fill="#4b4fd6" text-anchor="middle">面经</text><rect x="526" y="616" width="402" height="74" rx="12" fill="#e9eaff" stroke="none" /><g transform="translate(542 640) scale(1)" fill="none" stroke="#5b5ff0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="578" y="648" font-size="17" font-weight="600" fill="#16171b" >订单系统设计文档.md</text><text x="578" y="673" font-size="14" font-weight="400" fill="#8a92a8" >Markdown · 9 节</text><rect x="832" y="628" width="82" height="26" rx="13" fill="#e9eaff" stroke="none" /><text x="873" y="645.68" font-size="13" font-weight="500" fill="#4b4fd6" text-anchor="middle">项目资料</text><rect x="526" y="712" width="402" height="192" rx="14" fill="#ffffff" stroke="#e1e5ee" /><g transform="translate(542 728) scale(0.92)" fill="none" stroke="#5b5ff0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></g><text x="574" y="746" font-size="17" font-weight="600" fill="#16171b" >技能 · SKILL.md</text><rect x="864" y="728" width="48" height="26" rx="13" fill="#5b5ff0" stroke="none" /><circle cx="899" cy="741" r="10" fill="#fff"/><g font-family="'SF Mono',Menlo,monospace"><text x="544" y="786" font-size="15" font-weight="400" fill="#8a92a8" >---</text><text x="544" y="812" font-size="15" font-weight="400" fill="#16171b" >name: 系统设计答题框架</text><text x="544" y="838" font-size="15" font-weight="400" fill="#16171b" >description: 澄清需求 → 估算规模</text><text x="544" y="864" font-size="15" font-weight="400" fill="#16171b" >  → 核心链路 → 取舍与兜底</text><text x="544" y="890" font-size="15" font-weight="400" fill="#8a92a8" >---</text></g><rect x="960" y="300" width="526" height="620" rx="16" fill="#ffffff" stroke="#e1e5ee" /><g transform="translate(980 318) scale(0.92)" fill="none" stroke="#5b5ff0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="1012" y="337" font-size="18" font-weight="600" fill="#16171b" >订单系统设计文档.md</text><text x="1466" y="337" font-size="14" font-weight="600" fill="#1f9d6a" text-anchor="end">本机解析</text><path d="M976 358L1470 358" stroke="#e1e5ee"/><text x="982" y="402" font-size="21" font-weight="600" fill="#16171b" >## 3. 库存扣减</text><text x="982" y="440" font-size="17" fill="#16171b" font-weight="400">大促时库存先在 <tspan font-weight="600" fill="#4b4fd6">Redis</tspan> 中用 <tspan font-weight="600" fill="#4b4fd6">Lua 脚本原子扣减</tspan>，扣减成功后</text><text x="982" y="468" font-size="17" fill="#16171b" font-weight="400">发送事务消息，消费端按订单号幂等落库。</text><text x="982" y="560" font-size="21" font-weight="600" fill="#16171b" >## 4. 一致性兜底</text><text x="982" y="598" font-size="17" fill="#16171b" font-weight="400">写库后删除缓存，删除失败的 key 进入重试队列；同时 <tspan font-weight="600" fill="#4b4fd6">Canal </tspan></text><text x="982" y="626" font-size="17" fill="#16171b" font-weight="400"><tspan font-weight="600" fill="#4b4fd6">订阅 binlog</tspan> 异步再删一次。每日凌晨对账任务修正 Redis 与 </text><text x="982" y="654" font-size="17" fill="#16171b" font-weight="400">MySQL 的库存差异。</text><rect x="976" y="750" width="494" height="150" rx="12" fill="#e9eaff" stroke="none" /><text x="996" y="784" font-size="16" font-weight="600" fill="#4b4fd6" >回答时按问题检索</text><text x="996" y="818" font-size="16" fill="#16171b" font-weight="400">问到“删除缓存失败怎么办”，只取第 4 节相关片段，并标注 [项</text><text x="996" y="844" font-size="16" fill="#16171b" font-weight="400">目资料] 订单系统设计文档.md。</text></g><path d="M88 44H1511" stroke="#fff" stroke-opacity=".14"/><text x="800" y="972" font-size="9" font-weight="500" fill="#98a3ba" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#9ca6bb" stroke-width=".8"/><path d="M18 989H1582" stroke="#f4f6fd" stroke-opacity=".8"/><path d="M652 988H948L934 999Q932 1001 926 1001H674Q668 1001 666 999Z" fill="url(#notch)"/><path d="M64 1017H1536" stroke="#f0f3fc" stroke-opacity=".34"/><path d="M82 1025H1518" stroke="#3a4356" stroke-opacity=".74"/></g></g></svg>
