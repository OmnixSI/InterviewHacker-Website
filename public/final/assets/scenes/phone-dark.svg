<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" fill="none"><title>手机伴侣：当前问题与回答</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b5ff0"/><stop offset="1" stop-color="#5b5ff0"/></linearGradient><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121316"/><stop offset=".7" stop-color="#121316"/><stop offset="1" stop-color="#1c1d2a"/></linearGradient><radialGradient id="corner-glow"><stop stop-color="#1c1d2a" stop-opacity=".85"/><stop offset="1" stop-color="#1c1d2a" stop-opacity="0"/></radialGradient><linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a4258"/><stop offset="1" stop-color="#1f2434"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1e6f1"/><stop offset=".12" stop-color="#9aa4b8"/><stop offset=".56" stop-color="#737f96"/><stop offset=".86" stop-color="#b2bbcc"/><stop offset="1" stop-color="#5d6980"/></linearGradient><linearGradient id="rim-light" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".42" stop-color="#e0e8fb" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient><linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f3fa"/><stop offset=".16" stop-color="#c7d0df"/><stop offset=".55" stop-color="#a4b0c5"/><stop offset="1" stop-color="#67758f"/></linearGradient><linearGradient id="notch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6c7991"/><stop offset="1" stop-color="#b8c3d5"/></linearGradient><clipPath id="display"><rect x="74" y="42" width="1452" height="912" rx="16"/></clipPath></defs><g font-family="'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-rendering="geometricPrecision"><g><rect x="24" y="12" width="392" height="832" rx="58" fill="url(#metal)" stroke="#777d91" /><rect x="31" y="19" width="378" height="818" rx="52" fill="#101219" stroke="none" /><rect x="40" y="28" width="360" height="800" rx="45" fill="#121316" stroke="none" /><rect x="164" y="43" width="112" height="29" rx="15" fill="#101219" stroke="none" /><text x="69" y="64" font-size="16" font-weight="600" fill="#f1f3fb" >14:07</text><text x="340" y="64" font-size="13" font-weight="500" fill="#f1f3fb" >Wi-Fi</text><g transform="translate(62 100) scale(1)" fill="none" stroke="#9fa2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2m3-5v10m4-13v16m4-12v8m3-5h2"/></g><text x="96" y="120" font-size="22" font-weight="600" fill="#f1f3fb" >手机伴侣</text><rect x="254" y="98" width="95" height="28" rx="14" fill="#2a2c4a" stroke="none" /><text x="301.5" y="116.68" font-size="13" font-weight="500" fill="#babcff" text-anchor="middle">已连接 Mac</text><text x="64" y="166" font-size="14" font-weight="400" fill="#7f89a3" >同一 Wi-Fi · 字节后端二面</text><rect x="56" y="184" width="328" height="118" rx="20" fill="#1a1b20" stroke="#323a50" /><rect x="72" y="198" width="56" height="26" rx="13" fill="#2a2c4a" stroke="none" /><text x="100" y="215.68" font-size="13" font-weight="500" fill="#babcff" text-anchor="middle">追问</text><text x="74" y="258" font-size="19" fill="#f1f3fb" font-weight="600">如果删除缓存失败了怎么办？</text><rect x="56" y="318" width="328" height="382" rx="20" fill="#1a1b20" stroke="#323a50" /><g transform="translate(72 334) scale(0.83)" fill="none" stroke="#9fa2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></g><text x="100" y="351" font-size="17" font-weight="600" fill="#babcff" >建议回答</text><text x="74" y="396" font-size="20" fill="#f1f3fb" font-weight="400"><tspan font-weight="600" fill="#f1f3fb">删除失败的 key 进重试队列，再</tspan></text><text x="74" y="428" font-size="20" fill="#f1f3fb" font-weight="400"><tspan font-weight="600" fill="#f1f3fb">用 binlog 订阅兜底删一次。</tspan></text><path d="M74 500L366 500" stroke="#323a50"/><text x="74" y="536" font-size="15" fill="#b3bcd2" font-weight="400">• 重试队列：MQ 消费端重试，超过次数告警</text><text x="74" y="574" font-size="15" fill="#b3bcd2" font-weight="400">• 热点 key 延迟双删，降低旧值回填</text><text x="74" y="612" font-size="15" fill="#b3bcd2" font-weight="400">• 余额类强一致数据直接读库</text><text x="74" y="662" font-size="13" fill="#7f89a3" font-weight="400">首字出现即可开口，后续逐字补全。</text><rect x="56" y="716" width="100" height="52" rx="26" fill="#202127" stroke="#323a50" /><g transform="translate(94 730) scale(1)" fill="none" stroke="#f1f3fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></g><rect x="170" y="716" width="100" height="52" rx="26" fill="url(#accent)" stroke="none" /><text x="220" y="749" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">回答</text><rect x="284" y="716" width="100" height="52" rx="26" fill="#202127" stroke="#323a50" /><g transform="translate(322 730) scale(1)" fill="none" stroke="#f1f3fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></g><text x="220" y="796" font-size="13" font-weight="400" fill="#7f89a3" text-anchor="middle">遥控：上一条 · 回答 · 下一条</text><rect x="162" y="812" width="116" height="5" rx="3" fill="#f1f3fb" stroke="none" /></g></g></svg>
