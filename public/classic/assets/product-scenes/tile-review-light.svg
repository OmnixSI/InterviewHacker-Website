><rect x="90" y="146" width="440" height="792" rx="22" fill="#ffffff" stroke="#e1e5ee" /><rect x="110" y="166" width="400" height="46" rx="23" fill="#f4f5fa" stroke="none" /><g transform="translate(126 177) scale(0.92)" fill="none" stroke="#8a92a8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13M15.5 15.5 20 20"/></g><text x="158" y="196" font-size="16" font-weight="400" fill="#8a92a8" >搜索标题、问题和提词</text><rect x="110" y="226" width="108" height="32" rx="16" fill="#f4f5fa" stroke="#e1e5ee" /><g transform="translate(123 233) scale(0.75)" fill="none" stroke="#5d6680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 10 4-4 4 4M8 14l4 4 4-4"/></g><text x="150" y="247.04" font-size="14" font-weight="500" fill="#5d6680" >全部场景</text><rect x="228" y="226" width="104.08" height="32" rx="16" fill="#f4f5fa" stroke="#e1e5ee" /><g transform="translate(241 233) scale(0.75)" fill="none" stroke="#5d6680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 10 4-4 4 4M8 14l4 4 4-4"/></g><text x="268" y="247.04" font-size="14" font-weight="500" fill="#5d6680" >近 30 天</text><rect x="342.08" y="226" width="94" height="32" rx="16" fill="#f4f5fa" stroke="#e1e5ee" /><g transform="translate(355.08 233) scale(0.75)" fill="none" stroke="#5d6680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 10 4-4 4 4M8 14l4 4 4-4"/></g><text x="382.08" y="247.04" font-size="14" font-weight="500" fill="#5d6680" >按时间</text><rect x="108" y="282" width="404" height="80" rx="14" fill="#ece9ff" stroke="none" /><text x="128" y="315" font-size="19" font-weight="600" fill="#1f2335" >字节后端二面</text><text x="128" y="342" font-size="14" font-weight="400" fill="#8a92a8" >10月22日 14:00 · 46 分钟 · 9 问</text><rect x="108" y="374" width="404" height="80" rx="14" fill="#f4f5fa" stroke="none" /><text x="128" y="407" font-size="19" font-weight="600" fill="#1f2335" >组会 · Mamba 论文精读</text><text x="128" y="434" font-size="14" font-weight="400" fill="#8a92a8" >10月21日 19:30 · 32 分钟 · 6 问</text><rect x="108" y="466" width="404" height="80" rx="14" fill="#f4f5fa" stroke="none" /><text x="128" y="499" font-size="19" font-weight="600" fill="#1f2335" >华东代理商 · 年度续约</text><text x="128" y="526" font-size="14" font-weight="400" fill="#8a92a8" >10月20日 10:00 · 58 分钟 · 4 问</text><rect x="108" y="558" width="404" height="80" rx="14" fill="#f4f5fa" stroke="none" /><text x="128" y="591" font-size="19" font-weight="600" fill="#1f2335" >操作系统 · 虚拟内存</text><text x="128" y="618" font-size="14" font-weight="400" fill="#8a92a8" >10月18日 10:00 · 95 分钟 · 7 问</text><rect x="108" y="650" width="404" height="80" rx="14" fill="#f4f5fa" stroke="none" /><text x="128" y="683" font-size="19" font-weight="600" fill="#1f2335" >美团到店 · 后端一面</text><text x="128" y="710" font-size="14" font-weight="400" fill="#8a92a8" >10月15日 15:00 · 38 分钟 · 8 问</text><text x="312" y="880" font-size="14" font-weight="400" fill="#8a92a8" text-anchor="middle">共 5 条记录</text><rect x="548" y="146" width="962" height="792" rx="22" fill="#ffffff" stroke="#e1e5ee" /><text x="574" y="196" font-size="25" font-weight="600" fill="#1f2335" >字节后端二面 · 订单系统与缓存一致性</text><text x="574" y="228" font-size="15" font-weight="400" fill="#8a92a8" >10月22日 14:00 · 46 分钟 · 9 个问题 · 已加入场景经验库</text><rect x="1316" y="172" width="151.75" height="38" rx="19" fill="#f4f5fa" stroke="#e1e5ee" /><g transform="translate(1329 182) scale(0.75)" fill="none" stroke="#5d6680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="1356" y="196.4" font-size="15" font-weight="500" fill="#5d6680" >导出 Markdown</text><rect x="574" y="252" width="76" height="40" rx="20" fill="url(#accent)" stroke="none" /><text x="612" y="278" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">摘要</text><rect x="658" y="252" width="76" height="40" rx="20" fill="#f4f5fa" stroke="none" /><text x="696" y="278" font-size="16" font-weight="600" fill="#5d6680" text-anchor="middle">问题</text><rect x="742" y="252" width="76" height="40" rx="20" fill="#f4f5fa" stroke="none" /><text x="780" y="278" font-size="16" font-weight="600" fill="#5d6680" text-anchor="middle">转录</text><rect x="826" y="252" width="76" height="40" rx="20" fill="#f4f5fa" stroke="none" /><text x="864" y="278" font-size="16" font-weight="600" fill="#5d6680" text-anchor="middle">提词</text><text x="574" y="334" font-size="18" font-weight="600" fill="#1f2335" >问题清单与我的回答要点</text><rect x="574" y="352" width="910" height="72" rx="12" fill="#f4f5fa" stroke="none" /><text x="594" y="382" font-size="15" font-weight="600" fill="#5a4de0" >01</text><text x="630" y="382" font-size="18" font-weight="600" fill="#1f2335" >订单系统大促时库存怎么扣？</text><text x="630" y="409" font-size="15" font-weight="400" fill="#5d6680" >Redis + Lua 原子扣减，事务消息异步落库，消费端幂等。</text><rect x="574" y="434" width="910" height="72" rx="12" fill="#f4f5fa" stroke="none" /><text x="594" y="464" font-size="15" font-weight="600" fill="#5a4de0" >02</text><text x="630" y="464" font-size="18" font-weight="600" fill="#1f2335" >数据库和缓存怎么保证一致性？</text><text x="630" y="491" font-size="15" font-weight="400" fill="#5d6680" >先更新库再删缓存，binlog 订阅兜底，最终一致。</text><rect x="574" y="516" width="910" height="72" rx="12" fill="#f4f5fa" stroke="none" /><text x="594" y="546" font-size="15" font-weight="600" fill="#5a4de0" >03</text><text x="630" y="546" font-size="18" font-weight="600" fill="#1f2335" >删除缓存失败了怎么办？</text><text x="630" y="573" font-size="15" font-weight="400" fill="#5d6680" >重试队列 + Canal 再删一次，热点 key 延迟双删。</text><rect x="574" y="598" width="910" height="72" rx="12" fill="#f4f5fa" stroke="none" /><text x="594" y="628" font-size="15" font-weight="600" fill="#5a4de0" >04</text><text x="630" y="628" font-size="18" font-weight="600" fill="#1f2335" >Kafka 怎么保证消息不丢？</text><text x="630" y="655" font-size="15" font-weight="400" fill="#e88a2e" >只答了消费端手动提交，生产端 acks 没讲到。</text><text x="574" y="712" font-size="18" font-weight="600" fill="#1f2335" >复盘建议</text><g transform="translate(576 730) scale(0.92)" fill="none" stroke="#1f9d6a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="610" y="748" font-size="17" font-weight="400" fill="#1f2335" >缓存一致性讲得清楚，下次先给结论再展开。</text><g transform="translate(576 774) scale(0.92)" fill="none" stroke="#e88a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.2v.6M12 18h.01"/></g><text x="610" y="792" font-size="17" font-weight="400" fill="#1f2335" >Kafka 追问补上 acks=all、幂等生产者和重试。</text><g transform="translate(576 818) scale(0.92)" fill="none" stroke="#6a5cf0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></g><text x="610" y="836" font-size="17" font-weight="400" fill="#1f2335" >已整理 2 条经验、3 道改进回答进场景题库。</text><rect x="1256" y="862" width="228" height="46" rx="23" fill="url(#accent)" stroke="none" /><g transform="translate(1274 875) scale(0.83)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="1302" y="892" font-size="19" font-weight="500" fill="#fff" >加入下次准备</text></g><path d="M88 44H1511" stroke="#fff" stroke-opacity=".14"/><text x="800" y="972" font-size="9" font-weight="500" fill="#98a3ba" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#9ca6bb" stroke-width=".8"/><path d="M18 989H1582" stroke="#f4f6fd" stroke-opacity=".8"/><path d="M652 988H948L934 999Q932 1001 926 1001H674Q668 1001 666 999Z" fill="url(#notch)"/><path d="M64 1017H1536" stroke="#f0f3fc" stroke-opacity=".34"/><path d="M82 1025H1518" stroke="#3a4356" stroke-opacity=".74"/></g></g><rect x="540.5" y="140.5" width="719" height=