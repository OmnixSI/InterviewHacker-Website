<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1044" viewBox="0 0 1600 1044" fill="none"><defs><linearGradient id="ih-brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#666bff"/><stop offset="100%" stop-color="#9e52fa"/></linearGradient></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-rendering="geometricPrecision"><rect x="72" y="50" width="1456" height="896" rx="28" fill="#ffffff" stroke="#e3e6eb"/><rect x="72" y="50" width="1456" height="108" rx="28" fill="#ffffff" stroke="none"/><path d="M72 132h1456" stroke="#e3e6eb"/><circle cx="112" cy="87" r="10" fill="#ff625c"/><circle cx="142" cy="87" r="10" fill="#f7c544"/><circle cx="172" cy="87" r="10" fill="#36c96d"/><rect x="238" y="68" width="448" height="50" rx="25" fill="#f5f6f8" stroke="none"/><rect x="246" y="73" width="135" height="40" rx="20" fill="#f0f0ff" stroke="none"/><text x="278" y="101" fill="#666bff" font-size="25" font-weight="650">◉　助手</text><text x="415" y="101" fill="#5d6675" font-size="24" font-weight="500">▱　场景</text><text x="545" y="101" fill="#5d6675" font-size="24" font-weight="500">◷　记录</text><text x="664" y="101" fill="#5d6675" font-size="24" font-weight="500">⚙　设置</text><circle cx="1160" cy="92" r="7" fill="#48c77a"/><text x="1180" y="99" fill="#5d6675" font-size="22" font-weight="500">离线识别已就绪</text><text x="1400" y="101" fill="#14171c" font-size="24" font-weight="500">Ⅱ　 ■　 ▱</text><rect x="82" y="174" width="632" height="446" rx="24" fill="#ffffff" stroke="#e3e6eb"/><text x="112" y="212" fill="#14171c" font-size="29" font-weight="650">▣　实时对话</text><text x="375" y="212" fill="#5d6675" font-size="23" font-weight="500">产品工程师面试　⌄</text><text x="112" y="251" fill="#5d6675" font-size="20" font-weight="500">X-ASR 本机识别 · 仅保存转录文本</text><rect x="192" y="276" width="472" height="48" rx="16" fill="#f0f0ff" stroke="none"/><text x="214" y="307" fill="#14171c" font-size="23" font-weight="500">我通常先确认问题影响范围，再定位根因。</text><text x="112" y="365" fill="#5d6675" font-size="19" font-weight="500">面试官　14:06</text><rect x="108" y="380" width="448" height="58" rx="22" fill="#f5f6f8" stroke="none"/><text x="132" y="416" fill="#14171c" font-size="24" font-weight="500">线上服务突然变慢，你会怎么排查？</text><rect x="192" y="454" width="472" height="56" rx="18" fill="#f0f0ff" stroke="none"/><text x="214" y="489" fill="#14171c" font-size="24" font-weight="500">我会先确认影响面和发生时间……</text><text x="112" y="551" fill="#5d6675" font-size="20" font-weight="500">问题识别　·　等待下一句</text><circle cx="132" cy="582" r="8" fill="#666bff"/><path d="M129 582h6m-3-3v6" stroke="#fff" stroke-width="2"/><text x="153" y="589" fill="#5d6675" font-size="20" font-weight="500">当前场景：产品工程师面试</text><rect x="82" y="636" width="632" height="188" rx="24" fill="#ffffff" stroke="#e3e6eb"/><text x="112" y="675" fill="#14171c" font-size="25" font-weight="650">◷　回答记录</text><rect x="106" y="693" width="580" height="104" rx="18" fill="#f5f6f8" stroke="none"/><text x="130" y="723" fill="#5d6675" font-size="19" font-weight="500">14:06　线上服务排查</text><text x="130" y="757" fill="#14171c" font-size="23" font-weight="500">先看监控、日志与近期变更，再逐层缩小范围。</text><rect x="730" y="174" width="778" height="650" rx="24" fill="#ffffff" stroke="#e3e6eb"/><rect x="754" y="194" width="730" height="84" rx="42" fill="#f5f6f8" stroke="none"/><text x="786" y="230" fill="#666bff" font-size="25" font-weight="650">✦　建议回答</text><text x="786" y="258" fill="#14171c" font-size="23" font-weight="500">线上服务突然变慢，你会怎么排查？</text><rect x="754" y="296" width="730" height="482" rx="22" fill="#f5f6f8" stroke="none"/><text x="788" y="344" fill="#14171c" font-size="28" font-weight="650">我会先确认影响范围和发生时间，</text><text x="788" y="380" fill="#14171c" font-size="28" font-weight="650">再判断是全局问题还是局部问题。</text><text x="798" y="436" fill="#14171c" font-size="25" font-weight="500">•　查看监控，确认延迟、错误率和资源使用是否异常。</text><text x="798" y="480" fill="#14171c" font-size="25" font-weight="500">•　结合日志与链路追踪，定位耗时增加的服务环节。</text><text x="798" y="524" fill="#14171c" font-size="25" font-weight="500">•　核对近期发布、配置和依赖变化，验证可能的回归。</text><text x="788" y="580" fill="#14171c" font-size="25" font-weight="500">找到原因后先控制影响，再修复并补上监控与复盘。</text><rect x="788" y="698" width="116" height="44" rx="22" fill="#ffffff" stroke="#e3e6eb"/><text x="814" y="726" fill="#5d6675" font-size="22" font-weight="500">更简短</text><rect x="914" y="698" width="104" height="44" rx="22" fill="#ffffff" stroke="#e3e6eb"/><text x="936" y="726" fill="#5d6675" font-size="20" font-weight="500">举个例子</text><rect x="1028" y="698" width="96" height="44" rx="22" fill="#ffffff" stroke="#e3e6eb"/><text x="1050" y="726" fill="#5d6675" font-size="22" font-weight="500">STAR</text><rect x="1134" y="698" width="132" height="44" rx="22" fill="#ffffff" stroke="#e3e6eb"/><text x="1157" y="726" fill="#5d6675" font-size="20" font-weight="500">切换语言</text><rect x="1276" y="698" width="176" height="44" rx="22" fill="url(#ih-brand-gradient)" stroke="none"/><text x="1305" y="726" fill="#ffffff" font-size="22" font-weight="650">按需追问　→</text><rect x="82" y="836" width="1426" height="82" rx="20" fill="#ffffff" stroke="#e3e6eb"/><text x="112" y="885" fill="#5d6675" font-size="24" font-weight="500">输入问题，回车发送…</text><rect x="1300" y="854" width="182" height="48" rx="24" fill="url(#ih-brand-gradient)" stroke="none"/><text x="1331" y="885" fill="#ffffff" font-size="23" font-weight="650">✦　立即回答</text><text x="520" y="938" fill="#5d6675" font-size="18" font-weight="500">音频默认只在本机识别；场景与会话记录保存在本机。</text></g></svg>