" y="190" font-size="24" font-weight="400" fill="#626b83" >＋</text><rect x="104" y="220" width="206" height="88" rx="14" fill="#eeecff" stroke="none" /><g transform="translate(120 236) scale(0.8333333333333334)" fill="none" stroke="#6e63ed" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="120" y="286" font-size="20" font-weight="500" fill="#6e63ed" >产品设计面试</text><rect x="104" y="322" width="206" height="88" rx="14" fill="#ffffff" stroke="#e2e6f0" /><g transform="translate(120 338) scale(0.8333333333333334)" fill="none" stroke="#626b83" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l2 2 2-2h7v17h-7l-2 2-2-2H3zM12 5v17"/></g><text x="120" y="388" font-size="20" font-weight="400" fill="#24283b" >研究进展汇报</text><rect x="104" y="424" width="206" height="88" rx="14" fill="#ffffff" stroke="#e2e6f0" /><g transform="translate(120 440) scale(0.8333333333333334)" fill="none" stroke="#626b83" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3m2-6v12m5-15v18m5-15v12m2-6h3"/></g><text x="120" y="490" font-size="20" font-weight="400" fill="#24283b" >产品周会</text><rect x="104" y="526" width="206" height="88" rx="14" fill="#ffffff" stroke="#e2e6f0" /><g transform="translate(120 542) scale(0.8333333333333334)" fill="none" stroke="#626b83" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="120" y="592" font-size="20" font-weight="400" fill="#24283b" >数据结构课程</text><path d="M112 696H302" stroke="#e2e6f0"/><g transform="translate(116 726) scale(0.875)" fill="none" stroke="#626b83" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="150" y="745" font-size="18" font-weight="400" fill="#626b83" >资料保存在本机</text><text x="114" y="894" font-size="16" font-weight="400" fill="#626b83" >每场对话，独立准备。</text><text x="372" y="194" font-size="34" font-weight="500" fill="#24283b" >每场对话，都有自己的背景。</text><text x="374" y="233" font-size="20" font-weight="400" fill="#626b83" >选择场景，带入对应的目标、资料和回答要求。</text><rect x="370" y="265" width="170" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="455" y="291" font-size="18" font-weight="500" fill="#6e63ed" text-anchor="middle">资料与要求</text><rect x="554" y="265" width="170" height="38" rx="19" fill="#f6f7fb" stroke="none" /><text x="639" y="291" font-size="18" font-weight="500" fill="#626b83" text-anchor="middle">经验与题库</text><rect x="738" y="265" width="108" height="38" rx="19" fill="#f6f7fb" stroke="none" /><text x="792" y="291" font-size="18" font-weight="500" fill="#626b83" text-anchor="middle">复盘</text><rect x="368" y="332" width="536" height="580" rx="20" fill="#ffffff" stroke="#e2e6f0" /><rect x="924" y="332" width="584" height="580" rx="20" fill="#ffffff" stroke="#e2e6f0" /><text x="394" y="381" font-size="30" font-weight="500" fill="#24283b" >产品设计面试</text><rect x="732" y="352" width="146" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="805" y="378" font-size="18" font-weight="500" fill="#6e63ed" text-anchor="middle">面试场景</text><text x="396" y="420" font-size="20" font-weight="400" fill="#626b83" >目标角色</text><rect x="392" y="440" width="488" height="80" rx="13" fill="#f6f7fb" stroke="none" /><text x="414" y="488" font-size="24" font-weight="400" fill="#24283b" >产品设计师</text><text x="396" y="562" font-size="20" font-weight="400" fill="#626b83" >沟通目标</text><rect x="392" y="582" width="488" height="80" rx="13" fill="#f6f7fb" stroke="none" /><text x="414" y="630" font-size="24" font-weight="400" fill="#24283b" >用项目证据讲清设计取舍</text><text x="396" y="704" font-size="20" font-weight="400" fill="#626b83" >回答要求</text><rect x="392" y="724" width="488" height="80" rx="13" fill="#f6f7fb" stroke="none" /><text x="414" y="772" font-size="24" font-weight="400" fill="#24283b" >先给结论，再说明过程和结果</text><text x="954" y="381" font-size="27" font-weight="500" fill="#24283b" >本