<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1044" viewBox="0 0 1600 1044" fill="none"><title>悬浮提词器</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7564f4"/><stop offset="1" stop-color="#9e6af4"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfc5d4"/><stop offset=".35" stop-color="#525968"/><stop offset=".8" stop-color="#a7afc0"/><stop offset="1" stop-color="#6b7383"/></linearGradient><linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2d6e1"/><stop offset=".35" stop-color="#aeb5c6"/><stop offset="1" stop-color="#777f90"/></linearGradient><clipPath id="display"><rect x="74" y="42" width="1452" height="912" rx="16"/></clipPath><filter id="device-shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#0e1427" flood-opacity=".18"/></filter><filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0e1427" flood-opacity=".18"/></filter><filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0e1427" flood-opacity=".2"/></filter></defs><g font-family="'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-rendering="geometricPrecision"><g filter="url(#device-shadow)"><rect x="50" y="18" width="1500" height="966" rx="34" fill="url(#metal)" stroke="#6e7283" /><rect x="60" y="28" width="1480" height="946" rx="29" fill="#12141b" stroke="none" /><g clip-path="url(#display)"><rect x="74" y="42" width="1452" height="912" rx="16" fill="#141722" stroke="none" /><rect x="74" y="42" width="1452" height="82" rx="0" fill="#202433" stroke="none" /><path d="M74 124H1526" stroke="#363c50"/><circle cx="108" cy="82" r="8" fill="#ff6a65"/><circle cx="134" cy="82" r="8" fill="#f8c34b"/><circle cx="160" cy="82" r="8" fill="#62c878"/><text x="196" y="91" font-size="24" font-weight="500" fill="#f0f1fa" >InterviewHacker</text><rect x="450" y="60" width="492" height="46" rx="23" fill="#282d3e" stroke="none" /><rect x="456" y="64" width="117" height="38" rx="19" fill="#35305a" stroke="none" /><text x="515" y="90" font-size="21" font-weight="500" fill="#b0a6ff" text-anchor="middle">助手</text><text x="636" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">场景</text><text x="757" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">记录</text><text x="878" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">设置</text><circle cx="1182" cy="82" r="5" fill="#6ad9ae"/><text x="1198" y="89" font-size="18" font-weight="400" fill="#b1b8cf" >本机语音已就绪</text><text x="1473" y="90" font-size="23" font-weight="400" fill="#b1b8cf" >Ⅱ</text><rect x="74" y="124" width="1452" height="830" rx="0" fill="#141722" stroke="none" /><g opacity=".3"><rect x="158" y="190" width="1180" height="624" rx="22" fill="#202433" stroke="#363c50" /><text x="202" y="246" font-size="24" font-weight="400" fill="#b1b8cf" >实时对话</text><path d="M190 280H1308" stroke="#363c50"/><rect x="202" y="318" width="340" height="118" rx="16" fill="#282d3e" stroke="none" /><rect x="202" y="462" width="340" height="182" rx="16" fill="#282d3e" stroke="none" /><rect x="580" y="318" width="710" height="394" rx="16" fill="#282d3e" stroke="none" /></g><text x="240" y="250" font-size="30" font-weight="500" fill="#f0f1fa" >悬浮提词器</text><text x="240" y="288" font-size="23" font-weight="400" fill="#b1b8cf" >把重点留在视线里，让表达保持自然。</text><g filter="url(#card-shadow)"><rect x="238" y="340" width="1124" height="438" rx="24" fill="#202433" stroke="#363c50" /></g><circle cx="273" cy="378" r="6" fill="#6ad9ae"/><text x="292" y="385" font-size="19" font-weight="400" fill="#b1b8cf" >正在聆听</text><text x="1174" y="385" font-size="21" font-weight="400" fill="#b1b8cf" >−    A    ＋</text><path d="M264 408H1334" stroke="#363c50"/><text x="274" y="451" font-size="24" font-weight="400" fill="#b1b8cf" >如何推动跨团队合作？</text><text x="274" y="516" font-size="38" font-weight="500" fill="#f0f1fa" >先把分歧，转成共同目标。</text><text x="274" y="576" font-size="38" font-weight="500" fill="#f0f1fa" >用小范围验证找到依据，</text><text x="274" y="636" font-size="38" font-weight="500" fill="#f0f1fa" >再明确分工与下一步行动。</text><path d="M264 680H1334" stroke="#363c50"/><rect x="274" y="704" width="160" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="354" y="736" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">更简短</text><rect x="448" y="704" width="126" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="511" y="736" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">举例</text><rect x="588" y="704" width="126" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="651" y="736" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">STAR</text><rect x="1042" y="704" width="280" height="48" rx="24" fill="url(#accent)" stroke="none" /><text x="1182" y="736" font-size="21" font-weight="500" fill="#fff" text-anchor="middle">继续回答</text><text x="248" y="844" font-size="22" font-weight="400" fill="#b1b8cf" >助手窗口、悬浮提词器，按场合选择。</text></g><text x="800" y="974" font-size="10" font-weight="500" fill="#a4a8b6" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#959aa9"/><path d="M653 988H947L933 1000H667Z" fill="#707584"/><path d="M62 1017H1538" stroke="#636978" opacity=".6"/></g></g></svg>
