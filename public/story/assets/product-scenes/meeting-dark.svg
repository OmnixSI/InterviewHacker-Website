" y="190" font-size="24" font-weight="400" fill="#b2bed5" >＋</text><rect x="104" y="220" width="206" height="88" rx="14" fill="#1c2232" stroke="#343f55" /><g transform="translate(120 236) scale(0.8333333333333334)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="120" y="286" font-size="20" font-weight="400" fill="#f0f3fc" >产品设计面试</text><rect x="104" y="322" width="206" height="88" rx="14" fill="#353254" stroke="none" /><g transform="translate(120 338) scale(0.8333333333333334)" fill="none" stroke="#b9afff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l2 2 2-2h7v17h-7l-2 2-2-2H3zM12 5v17"/></g><text x="120" y="388" font-size="20" font-weight="500" fill="#b9afff" >产品周会</text><rect x="104" y="424" width="206" height="88" rx="14" fill="#1c2232" stroke="#343f55" /><g transform="translate(120 440) scale(0.8333333333333334)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3m2-6v12m5-15v18m5-15v12m2-6h3"/></g><text x="120" y="490" font-size="20" font-weight="400" fill="#f0f3fc" >研究进展汇报</text><rect x="104" y="526" width="206" height="88" rx="14" fill="#1c2232" stroke="#343f55" /><g transform="translate(120 542) scale(0.8333333333333334)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="120" y="592" font-size="20" font-weight="400" fill="#f0f3fc" >数据结构课程</text><path d="M112 696H302" stroke="#343f55"/><g transform="translate(116 726) scale(0.875)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="150" y="745" font-size="18" font-weight="400" fill="#b2bed5" >资料保存在本机</text><text x="114" y="894" font-size="16" font-weight="400" fill="#b2bed5" >每场对话，独立准备。</text><text x="372" y="194" font-size="34" font-weight="500" fill="#f0f3fc" >产品周会 · 决定事项与下一步</text><text x="374" y="233" font-size="20" font-weight="400" fill="#b2bed5" >议程、讨论重点与行动事项</text><rect x="370" y="265" width="112" height="38" rx="19" fill="#353254" stroke="none" /><text x="426" y="291" font-size="18" font-weight="500" fill="#b9afff" text-anchor="middle">摘要</text><rect x="496" y="265" width="112" height="38" rx="19" fill="#252d40" stroke="none" /><text x="552" y="291" font-size="18" font-weight="500" fill="#b2bed5" text-anchor="middle">问题</text><rect x="622" y="265" width="112" height="38" rx="19" fill="#252d40" stroke="none" /><text x="678" y="291" font-size="18" font-weight="500" fill="#b2bed5" text-anchor="middle">转录</text><rect x="748" y="265" width="112" height="38" rx="19" fill="#252d40" stroke="none" /><text x="804" y="291" font-size="18" font-weight="500" fill="#b2bed5" text-anchor="middle">回答</text><rect x="368" y="332" width="462" height="580" rx="20" fill="#1c2232" stroke="#343f55" /><rect x="850" y="332" width="658" height="580" rx="20" fill="#1c2232" stroke="#343f55" /><text x="396" y="381" font-size="26" font-weight="500" fill="#f0f3fc" >讨论脉络</text><rect x="390" y="414" width="418" height="114" rx="15" fill="#353254" stroke="none" /><text x="410" y="448" font-size="18" font-weight="500" fill="#b9afff" >01</text><text x="410" y="486" font-size="23" font-weight="400" fill="#f0f3fc" >本轮验证希望解决什么问题？</text><rect x="390" y="550" width="418" height="114" rx="15" fill="#252d40" stroke="none" /><text x="410" y="584" font-size="18" font-weight="500" fill="#b9afff" >02</text><text x="410" y="622" font-size="23" font-weight="400" fill="#f0f3fc" >先在哪个范围进行验证？</text><rect x="390" y="686" width="418" height="114" rx="15" fill="#252d40" stroke="none" /><text x="410" y="720" font-size="18" font-weight="500" fill="#b9afff" >03</text><text x="410" y="758" font-size="23" font-weight="400" fill="#f0f3fc" >下一次需要带回哪些结果？</text><g transform="translate(398 858) scale(0.9583333333333334)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"/></g><text x="436" y="880" font-size="21" font-weight="400" fill="#b2bed5" >完整转录与回答可回看</text><text x="882" y="381" font-size="27" font-weight="500" fill="#f0f3fc" >会议摘要</text><rect x="878" y="408" width="602" height="178" rx="16" fill="#353254" stroke="none" /><text x="902" y="454" font-size="25" font-weight="400" fill="#f0f3fc" >先用小范围验证方案，</text><text x="902" y="497" font-size="25" font-weight="400" fill="#f0f3fc" >确认关键假设后再扩大投入。</text><text x="902" y="540" font-size="25" font-weight="400" fill="#f0f3fc" >下一次对齐时，带回结果与问题。</text><text x="884" y="638" font-size="24" font-weight="500" fill="#f0f3fc" >行动事项</text><text x="884" y="684" font-size="22" font-weight="400" fill="#b2bed5" >01   产品：明确验证目标与范围。</text><text x="884" y="732" font-size="22" font-weight="400" fill="#b2bed5" >02   设计：补齐核心流程与原型。</text><text x="884" y="780" font-size="22" font-weight="400" fill="#b2bed5" >03   研发：同步方案限制与依赖。</text><rect x="882" y="838" width="276" height="48" rx="24" fill="url(#accent)" stroke="none" /><text x="1020" y="870" font-size="21" font-weight="500" fill="#fff" text-anchor="middle">加入后续准备</text><rect x="1176" y="838" width="282" height="48" rx="24" fill="#252d40" stroke="none" /><text x="1317" y="870" font-size="21" font-weight="500" fill="#b2bed5" text-anchor="middle">回看完整记录</text></g><path d="M88 44H1511" stroke="#fff" stroke-opacity=".18"/><text x="800" y="972" font-size="9" font-weight="500" fill="#98a3ba" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#9ca6bb" stroke-width=".8"/><path d="M18 989H1582" stroke="#f4f6fd" stroke-opacity=".8"/><path d="M652 988H948L934 999Q932 1001 926 1001H674Q668 1001 666 999Z" fill="url(#notch)"/><path d="M64 1017H1536" stroke="#f0f3fc" stroke-opacity=".34"/><path d="M82 1025H1518" stroke="#3a4356" stroke-opa