50" y="332" width="658" height="580" rx="20" fill="#202433" stroke="none" /><text x="396" y="381" font-size="26" font-weight="500" fill="#f0f1fa" >讨论脉络</text><rect x="390" y="414" width="418" height="114" rx="15" fill="#35305a" stroke="none" /><text x="410" y="448" font-size="18" font-weight="500" fill="#b0a6ff" >01</text><text x="410" y="486" font-size="23" font-weight="400" fill="#f0f1fa" >本轮验证希望解决什么问题？</text><rect x="390" y="550" width="418" height="114" rx="15" fill="#282d3e" stroke="none" /><text x="410" y="584" font-size="18" font-weight="500" fill="#b0a6ff" >02</text><text x="410" y="622" font-size="23" font-weight="400" fill="#f0f1fa" >先在哪个范围进行验证？</text><rect x="390" y="686" width="418" height="114" rx="15" fill="#282d3e" stroke="none" /><text x="410" y="720" font-size="18" font-weight="500" fill="#b0a6ff" >03</text><text x="410" y="758" font-size="23" font-weight="400" fill="#f0f1fa" >下一次需要带回哪些结果？</text><g transform="translate(398 858) scale(0.9583333333333334)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0"/></g><text x="436" y="880" font-size="21" font-weight="400" fill="#b1b8cf" >完整转录与回答可回看</text><text x="882" y="381" font-size="27" font-weight="500" fill="#f0f1fa" >会议摘要</text><rect x="878" y="408" width="602" height="178" rx="16" fill="#35305a" stroke="none" /><text x="902" y="454" font-size="25" font-weight="400" fill="#f0f1fa" >先用小范围验证方案，</text><text x="902" y="497" font-size="25" font-weight="400" fill="#f0f1fa" >确认关键假设后再扩大投入。</text><text x="902" y="540" font-size="25" font-weight="400" fill="#f0f1fa" >下一次对齐时，带回结果与问题。</text><text x="884" y="638" font-size="24" font-weight="500" fill="#f0f1fa" >行动事项</text><text x="884" y="684" font-size="22" font-weight="400" fill="#b1b8cf" >01   产品：明确验证目标与范围。</text><text x="884" y="732" font-size="22" font-weight="400" fill="#b1b8cf" >02   设计：补齐核心流程与原型。</text><text x="884" y="780" font-size="22" font-weight="400" fill="#b1b8cf" >03   研发：同步方案限制与依赖。</text><rect x="882" y="838" width="276" height="48" rx="24" fill="url(#accent)" stroke="none" /><text x="1020" y="870" font-size="21" font-weight="500" fill="#fff" text-anchor="middle">加入后续准备</text><rect x="1176" y="838" width="282" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="1317" y="870" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">回看完整记录</text></g><text x="800" y="974" font-size="10" font-weight="500" fill="#a4a8b6" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#959aa9"/><path d="M653 988H947L933 1000H667Z" fill="#707584"/><path d="M62 1017H1538" stroke="#636978" opacity=".6"/></g></g></svg>
