83.575" width="3" height="36.85" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="655.304347826087" y="392.415" width="3" height="19.17" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="664.3478260869565" y="387.735" width="3" height="28.53" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="673.391304347826" y="398.37" width="3" height="7.26" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="682.4347826086956" y="394.875" width="3" height="14.25" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="691.4782608695652" y="397.73" width="3" height="8.54" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="700.5217391304348" y="382.89" width="3" height="38.22" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="709.5652173913044" y="392.54" width="3" height="18.92" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="718.608695652174" y="385.435" width="3" height="33.13" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="727.6521739130435" y="393.39" width="3" height="17.22" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="736.695652173913" y="397.82" width="3" height="8.36" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="745.7391304347826" y="393.84" width="3" height="16.32" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="754.7826086956522" y="391.86" width="3" height="20.28" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="763.8260869565217" y="383.135" width="3" height="37.73" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="772.8695652173913" y="393.835" width="3" height="16.33" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="781.9130434782609" y="385.3" width="3" height="33.4" rx="1.5" fill="#2b9d72" stroke="none" /><rect x="790.9565217391305" y="398.715" width="3" height="6.57" rx="1.5" fill="#2b9d72" stroke="none" /><text x="372" y="490" font-size="20" font-weight="400" fill="#5f657a" >对方</text><rect x="366" y="510" width="460" height="130" rx="18" fill="#f5f6fb" stroke="none" /><text x="388" y="552" font-size="25" font-weight="400" fill="#222538" >你是怎样推动跨团队合作，</text><text x="388" y="592" font-size="25" font-weight="400" fill="#222538" >让一个有分歧的项目落地的？</text><text x="372" y="690" font-size="20" font-weight="400" fill="#5f657a" >我</text><rect x="404" y="710" width="422" height="126" rx="18" fill="#eeecff" stroke="none" /><text x="426" y="752" font-size="23" font-weight="400" fill="#222538" >我会先找到共同目标，</text><text x="426" y="790" font-size="23" font-weight="400" fill="#222538" >再把分歧转成可验证的方案。</text><text x="370" y="900" font-size="19" font-weight="400" fill="#5f657a" >问题会随对方的补充更新</text><g transform="translate(896 175) scale(1.0833333333333333)" fill="none" stroke="#6e63ed" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="935" y="197" font-size="29" font-weight="500" fill="#222538" >建议回答</text><rect x="1316" y="169" width="164" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="1398" y="195" font-size="18" font-weight="500" fill="#6e63ed" text-anchor="middle">当前场景</text><path d="M894 220H1482" stroke="#e3e6ef"/><text x="900" y="266" font-size="23" font-weight="400" fill="#5f657a" >如何推动跨团队合作？</text><text x="900" y="335" font-size="30" font-weight="500" fill="#222538" >先对齐目标，再验证方案。</text><text x="900" y="393" font-size="25" font-weight="400" fill="#222538" >在项目初期，我会先明确共同的</text><text x="900" y="435" font-size="25" font-weight="400" fill="#222538" >业务目标，把不同意见拆成可比较的</text><text x="900" y="477" font-size="25" font-weight="400" fill="#222538" >方案与判断标准。</text><text x="900" y="555" font-size="24" font-weight="400" fill="#5f657a" >01   先听清各方真正关心的问题。</text><text x="900" y="607" font-size="24" font-weight="400" fill="#5f657a" >02   用小范围验证建立共同依据。</text><text x="900" y="659" font-size="24" font-weight="400" fill="#5f657a" >03   明确分工、节点和下一步行动。</text><rect x="896" y="755" width="222" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="1007" y="781" font-size="18" font-weight="500" fill="#6e63ed" text-anchor="middle">简历 · 项目经历</text><rect x="1132" y="755" width="222" 