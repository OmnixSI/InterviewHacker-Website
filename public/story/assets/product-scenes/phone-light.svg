<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" fill="none"><title>手机伴侣</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7564f4"/><stop offset="1" stop-color="#9e6af4"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfc5d4"/><stop offset=".35" stop-color="#525968"/><stop offset=".8" stop-color="#a7afc0"/><stop offset="1" stop-color="#6b7383"/></linearGradient><linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2d6e1"/><stop offset=".35" stop-color="#aeb5c6"/><stop offset="1" stop-color="#777f90"/></linearGradient><clipPath id="display"><rect x="74" y="42" width="1452" height="912" rx="16"/></clipPath><filter id="device-shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#0e1427" flood-opacity=".18"/></filter><filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0e1427" flood-opacity=".18"/></filter><filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0e1427" flood-opacity=".2"/></filter></defs><g font-family="'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-rendering="geometricPrecision"><g filter="url(#phone-shadow)"><rect x="24" y="12" width="392" height="832" rx="58" fill="url(#metal)" stroke="#777d91" /><rect x="31" y="19" width="378" height="818" rx="52" fill="#101219" stroke="none" /><rect x="40" y="28" width="360" height="800" rx="45" fill="#eef0f7" stroke="none" /><rect x="164" y="43" width="112" height="29" rx="15" fill="#101219" stroke="none" /><text x="69" y="64" font-size="16" font-weight="500" fill="#222538" >9:41</text><text x="337" y="64" font-size="15" font-weight="400" fill="#222538" >•••</text><g transform="translate(64 109) scale(1)" fill="none" stroke="#6e63ed" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3m2-6v12m5-15v18m5-15v12m2-6h3"/></g><text x="101" y="130" font-size="24" font-weight="500" fill="#222538" >手机伴侣</text><rect x="66" y="154" width="150" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="141" y="180" font-size="18" font-weight="500" fill="#6e63ed" text-anchor="middle">同一 Wi-Fi</text><path d="M62 214H378" stroke="#e3e6ef"/><text x="66" y="250" font-size="18" font-weight="400" fill="#5f657a" >当前问题</text><rect x="60" y="268" width="320" height="124" rx="19" fill="#ffffff" stroke="none" /><text x="78" y="308" font-size="22" font-weight="400" fill="#222538" >你是怎样推动跨团队合作，</text><text x="78" y="344" font-size="22" font-weight="400" fill="#222538" >让有分歧的项目落地的？</text><g transform="translate(66 428) scale(0.9166666666666666)" fill="none" stroke="#6e63ed" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="99" y="448" font-size="22" font-weight="500" fill="#222538" >建议回答</text><rect x="60" y="470" width="320" height="246" rx="19" fill="#ffffff" stroke="none" /><text x="80" y="514" font-size="27" font-weight="500" fill="#222538" >先对齐共同目标，</text><text x="80" y="556" font-size="27" font-weight="500" fill="#222538" >再验证方案。</text><text x="80" y="622" font-size="19" font-weight="400" fill="#5f657a" >把不同意见变成可比较的</text><text x="80" y="654" font-size="19" font-weight="400" fill="#5f657a" >方案，明确分工与下一步。</text><text x="220" y="762" font-size="15" font-weight="400" fill="#5f657a" text-anchor="middle">当前问题与回答，同步查看</text><rect x="162" y="804" width="116" height="5" rx="3" fill="#222538" stroke="none" /></g></g></svg>
