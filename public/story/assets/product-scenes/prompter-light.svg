<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1044" viewBox="0 0 1600 1044" fill="none"><title>悬浮提词器</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7265ed"/><stop offset="1" stop-color="#9769ee"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1e6f1"/><stop offset=".12" stop-color="#9aa4b8"/><stop offset=".56" stop-color="#737f96"/><stop offset=".86" stop-color="#b2bbcc"/><stop offset="1" stop-color="#5d6980"/></linearGradient><linearGradient id="rim-light" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".42" stop-color="#e0e8fb" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient><linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f3fa"/><stop offset=".16" stop-color="#c7d0df"/><stop offset=".55" stop-color="#a4b0c5"/><stop offset="1" stop-color="#67758f"/></linearGradient><linearGradient id="notch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6c7991"/><stop offset="1" stop-color="#b8c3d5"/></linearGradient><clipPath id="display"><rect x="74" y="42" width="1452" height="912" rx="16"/></clipPath><filter id="device-shadow" x="-8%" y="-6%" width="116%" height="126%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0d1426" flood-opacity=".17"/></filter><filter id="contact-shadow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="6"/></filter><filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#0d1426" flood-opacity=".16"/></filter><filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0d1426" flood-opacity=".18"/></filter></defs><g font-family="'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif" text-rendering="geometricPrecision"><ellipse cx="800" cy="1026" rx="660" ry="6" fill="#101626" opacity=".16" filter="url(#contact-shadow)"/><g filter="url(#device-shadow)"><rect x="50" y="18" width="1500" height="966" rx="34" fill="url(#metal)" stroke="#7b8498" /><rect x="53" y="21" width="1494" height="960" rx="31" fill="none" stroke="url(#rim-light)" /><rect x="60" y="28" width="1480" height="946" rx="28" fill="#10131b" stroke="none" /><path d="M87 42H1513" stroke="#bfc8db" stroke-opacity=".25"/><circle cx="800" cy="34" r="3.2" fill="#090d15" stroke="#8491aa" stroke-width=".6"/><circle cx="799.3" cy="33.3" r=".8" fill="#7186a5"/><g clip-path="url(#display)"><rect x="74" y="42" width="1452" height="912" rx="16" fill="#eff1f7" stroke="none" /><rect x="74" y="42" width="1452" height="82" rx="0" fill="#ffffff" stroke="#e2e6f0" /><path d="M74 124H1526" stroke="#e2e6f0"/><circle cx="108" cy="82" r="8" fill="#ff6a65"/><circle cx="134" cy="82" r="8" fill="#f8c34b"/><circle cx="160" cy="82" r="8" fill="#62c878"/><text x="196" y="91" font-size="24" font-weight="500" fill="#24283b" >InterviewHacker</text><rect x="450" y="60" width="492" height="46" rx="23" fill="#f6f7fb" stroke="none" /><rect x="456" y="64" width="117" height="38" rx="19" fill="#eeecff" stroke="none" /><text x="515" y="90" font-size="21" font-weight="500" fill="#6e63ed" text-anchor="middle">助手</text><text x="636" y="90" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">场景</text><text x="757" y="90" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">记录</text><text x="878" y="90" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">设置</text><circle cx="1182" cy="82" r="5" fill="#248563"/><text x="1198" y="89" font-size="18" font-weight="400" fill="#626b83" >本机语音已就绪</text><text x="1473" y="90" font-size="23" font-weight="400" fill="#626b83" >Ⅱ</text><rect x="74" y="124" width="1452" height="830" rx="0" fill="#eff1f7" stroke="none" /><g opacity=".3"><rect x="158" y="190" width="1180" height="624" rx="22" fill="#ffffff" stroke="#e2e6f0" /><text x="202" y="246" font-size="24" font-weight="400" fill="#626b83" >实时对话</text><path d="M190 280H1308" stroke="#e2e6f0"/><rect x="202" y="318" width="340" height="118" rx="16" fill="#f6f7fb" stroke="none" /><rect x="202" y="462" width="340" height="182" rx="16" fill="#f6f7fb" stroke="none" /><rect x="580" y="318" width="710" height="394" rx="16" fill="#f6f7fb" stroke="none" /></g><text x="240" y="250" font-size="30" font-weight="500" fill="#24283b" >悬浮提词器</text><text x="240" y="288" font-size="23" font-weight="400" fill="#626b83" >把重点留在视线里，让表达保持自然。</text><g filter="url(#card-shadow)"><rect x="238" y="340" width="1124" height="438" rx="24" fill="#ffffff" stroke="#e2e6f0" /></g><circle cx="273" cy="378" r="6" fill="#248563"/><text x="292" y="385" font-size="19" font-weight="400" fill="#626b83" >正在聆听</text><text x="1174" y="385" font-size="21" font-weight="400" fill="#626b83" >−    A    ＋</text><path d="M264 408H1334" stroke="#e2e6f0"/><text x="274" y="451" font-size="24" font-weight="400" fill="#626b83" >如何推动跨团队合作？</text><text x="274" y="516" font-size="38" font-weight="500" fill="#24283b" >先把分歧，转成共同目标。</text><text x="274" y="576" font-size="38" font-weight="500" fill="#24283b" >用小范围验证找到依据，</text><text x="274" y="636" font-size="38" font-weight="500" fill="#24283b" >再明确分工与下一步行动。</text><path d="M264 680H1334" stroke="#e2e6f0"/><rect x="274" y="704" width="160" height="48" rx="24" fill="#f6f7fb" stroke="none" /><text x="354" y="736" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">更简短</text><rect x="448" y="704" width="126" height="48" rx="24" fill="#f6f7fb" stroke="none" /><text x="511" y="736" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">举例</text><rect x="588" y="704" width="126" height="48" rx="24" fill="#f6f7fb" stroke="none" /><text x="651" y="736" font-size="21" font-weight="500" fill="#626b83" text-anchor="middle">STAR</text><rect x="1042" y="704" width="280" height="48" rx="24" fill="url(#accent)" stroke="none" /><text x="1182" y="736" font-size="21" font-weight="500" fill="#fff" text-anchor="middle">继续回答</text><text x="248" y="844" font-size="22" font-weight="400" fill="#626b83" >助手窗口、悬浮提词器，按场合选择。</text></g><path d="M88 44H1511" stroke="#fff" stroke-opacity=".18"/><text x="800" y="972" font-size="9" font-weight="500" fill="#98a3ba" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#9ca6bb" stroke-width=".8"/><path d="M18 989H1582" stroke="#f4f6fd" stroke-opacity=".8"/><path d="M652 988H948L934 999Q932 1001 926 1001H674Q668 1001 666 999Z" fill="url(#notch)"/><path d="M64 1017H1536" stroke="#f0f3fc" stroke-opacity=".34"/><path d="M82 1025H1518" stroke="#3a4356" stroke-opacity=".74"/></g></g></svg>
