stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3"/></g><text x="156" y="566" font-size="18" font-weight="500" fill="#1f2335" >技能</text><rect x="408" y="146" width="1102" height="792" rx="22" fill="#ffffff" stroke="#e1e5ee" /><text x="436" y="198" font-size="28" font-weight="600" fill="#1f2335" >数据去向，由你决定。</text><text x="436" y="232" font-size="17" font-weight="400" fill="#5d6680" >本机识别与保存，外部服务按你的配置使用。</text><rect x="436" y="268" width="334" height="410" rx="18" fill="#f4f5fa" stroke="none" /><circle cx="480" cy="312" r="24" fill="#1f9d6a" fill-opacity=".16"/><g transform="translate(467 299) scale(1.08)" fill="none" stroke="#1f9d6a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></g><text x="460" y="378" font-size="23" font-weight="600" fill="#1f2335" >保存在本机</text><g transform="translate(460 412) scale(0.83)" fill="none" stroke="#1f9d6a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="490" y="429" font-size="17" font-weight="400" fill="#5d6680" >场景资料与 Markdown</text><g transform="translate(460 468) scale(0.83)" fill="none" stroke="#1f9d6a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="490" y="485" font-size="17" font-weight="400" fill="#5d6680" >会话转录、问题与回答</text><g transform="translate(460 524) scale(0.83)" fill="none" stroke="#1f9d6a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="490" y="541" font-size="17" font-weight="400" fill="#5d6680" >经验库与题库</text><path d="M460 596L746 596" stroke="#e1e5ee"/><text x="460" y="636" font-size="16" font-weight="600" fill="#1f9d6a" >原始音频不保存</text><rect x="788" y="268" width="334" height="410" rx="18" fill="#f4f5fa" stroke="none" /><circle cx="832" cy="312" r="24" fill="#6a5cf0" fill-opacity=".16"/><g transform="translate(819 299) scale(1.08)" fill="none" stroke="#6a5cf0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></g><text x="812" y="378" font-size="23" font-weight="600" fill="#1f2335" >生成回答时发送</text><g transform="translate(812 412) scale(0.83)" fill="none" stroke="#6a5cf0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="842" y="429" font-size="17" font-weight="400" fill="#5d6680" >当前问题与转录</text><g transform="translate(812 468) scale(0.83)" fill="none" stroke="#6a5cf0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="842" y="485" font-size="17" font-weight="400" fill="#5d6680" >检索到的资料片段</text><g transform="translate(812 524) scale(0.83)" fill="none" stroke="#6a5cf0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="842" y="541" font-size="17" font-weight="400" fill="#5d6680" >主动添加的截图与技能</text><path d="M812 596L1098 596" stroke="#e1e5ee"/><text x="812" y="636" font-size="16" font-weight="600" fill="#6a5cf0" >发往你配置的回答引擎</text><rect x="1140" y="268" width="334" height="410" rx="18" fill="#f4f5fa" stroke="none" /><circle cx="1184" cy="312" r="24" fill="#e88a2e" fill-opacity=".16"/><g transform="translate(1171 299) scale(1.08)" fill="none" stroke="#e88a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g><text x="1164" y="378" font-size="23" font-weight="600" fill="#1f2335" >按需开启</text><g transform="translate(1164 412) scale(0.83)" fill="none" stroke="#e88a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="1194" y="429" font-size="17" font-weight="400" fill="#5d6680" >云端识别（需同意）</text><g transform="translate(1164 468) scale(0.83)" fill="none" stroke="#e88a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="1194" y="485" font-size="17" font-weight="400" fill="#5d6680" >联网搜索（问题文本）</text><g transform="translate(1164 524) scale(0.83)" fill="none" stroke="#e88a2e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></g><text x="1194" y="541" font-size="17" font-weight="400" fill="#5d6680" >手机伴侣（同一 Wi-Fi）</text><path d="M1164 596L1450 596" stroke="#e1e5ee"/><text x="1164" y="636" font-size="16" font-weight="600" fill="#e88a2e" >默认关闭，可随时切换</text><rect x="436" y="702" width="1046" height="120" rx="16" fill="#ece9ff" stroke="none" /><g transform="translate(458 722) scale(0.92)" fill="none" stroke="#5a4de0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g><text x="490" y="740" font-size="18" font-weight="600" fill="#1f2335" >导出与导入</text><text x="490" y="772" font-size="16" font-weight="400" fill="#5d6680" >一个 .ihbackup 文件包含全部场景、记录和设置；默认不含密钥。</text><text x="490" y="800" font-size="16" font-weight="400" fill="#5d6680" >每天自动备份，更新前和导入前也会备份。</text></g><path d="M88 44H1511" stroke="#fff" stroke-opacity=".14"/><text x="800" y="972" font-size="9" font-weight="500" fill="#98a3ba" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#9ca6bb" stroke-width=".8"/><path d="M18 989H1582" stroke="#f4f6fd" stroke-opacity=".8"/><path d="M652 988H948L934 999Q932 1001 926 1001H674Q668 1001 666 999Z" fill="url(#notch)"/><path d="M64 1017H1536" stroke="#f0f3fc" stroke-opacity=".34"/><path d="M82 1025H1518" stroke="#3a4356" stroke-opacity=".74"/></g></g></svg>
