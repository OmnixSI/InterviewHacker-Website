font-size="24" font-weight="500" fill="#f0f1fa" >InterviewHacker</text><rect x="450" y="60" width="492" height="46" rx="23" fill="#282d3e" stroke="none" /><rect x="456" y="64" width="117" height="38" rx="19" fill="#35305a" stroke="none" /><text x="515" y="90" font-size="21" font-weight="500" fill="#b0a6ff" text-anchor="middle">助手</text><text x="636" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">场景</text><text x="757" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">记录</text><text x="878" y="90" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">设置</text><circle cx="1182" cy="82" r="5" fill="#6ad9ae"/><text x="1198" y="89" font-size="18" font-weight="400" fill="#b1b8cf" >本机语音已就绪</text><text x="1473" y="90" font-size="23" font-weight="400" fill="#b1b8cf" >Ⅱ</text><rect x="92" y="144" width="230" height="790" rx="20" fill="#202433" stroke="none" /><text x="114" y="190" font-size="24" font-weight="500" fill="#f0f1fa" >我的场景</text><text x="286" y="190" font-size="24" font-weight="400" fill="#b1b8cf" >＋</text><rect x="104" y="220" width="206" height="88" rx="14" fill="#35305a" stroke="none" /><g transform="translate(120 236) scale(0.8333333333333334)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="120" y="286" font-size="20" font-weight="500" fill="#b0a6ff" >产品设计面试</text><rect x="104" y="322" width="206" height="88" rx="14" fill="#202433" stroke="none" /><g transform="translate(120 338) scale(0.8333333333333334)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l2 2 2-2h7v17h-7l-2 2-2-2H3zM12 5v17"/></g><text x="120" y="388" font-size="20" font-weight="400" fill="#f0f1fa" >研究进展汇报</text><rect x="104" y="424" width="206" height="88" rx="14" fill="#202433" stroke="none" /><g transform="translate(120 440) scale(0.8333333333333334)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3m2-6v12m5-15v18m5-15v12m2-6h3"/></g><text x="120" y="490" font-size="20" font-weight="400" fill="#f0f1fa" >产品周会</text><rect x="104" y="526" width="206" height="88" rx="14" fill="#202433" stroke="none" /><g transform="translate(120 542) scale(0.8333333333333334)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="120" y="592" font-size="20" font-weight="400" fill="#f0f1fa" >数据结构课程</text><path d="M112 696H302" stroke="#363c50"/><g transform="translate(116 726) scale(0.875)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="150" y="745" font-size="18" font-weight="400" fill="#b1b8cf" >资料保存在本机</text><text x="114" y="894" font-size="16" font-weight="400" fill="#b1b8cf" >每场对话，独立准备。</text><rect x="342" y="144" width="508" height="790" rx="20" fill="#202433" stroke="none" /><rect x="868" y="144" width="640" height="790" rx="20" fill="#202433" stroke="none" /><text x="370" y="190" font-size="29" font-weight="500" fill="#f0f1fa" >当前场景与资料</text><rect x="676" y="163" width="144" height="38" rx="19" fill="#35305a" stroke="none" /><text x="748" y="189" font-size="18" font-weight="500" fill="#b0a6ff" text-anchor="middle">面试</text><rect x="366" y="226" width="460" height="158" rx="17" fill="#282d3e" stroke="none" /><g transform="translate(388 248) scale(0.9583333333333334)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3z"/></g><text x="424" y="269" font-size="19" font-weight="400" fill="#b1b8cf" >当前场景</text><text x="388" y="314" font-size="26" font-weight="500" fill="#f0f1fa" >产品设计面试</text><text x="388" y="352" font-size="20" font-weight="400" fill="#b1b8cf" >关注设计取舍与跨团队协作</text><rect x="366" y="407" width="460" height="158" rx="17" fill="#282d3e" stroke="none" /><g transform="translate(388 429) scale(0.9583333333333334)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="424" y="450" font-size="19" font-weight="400" fill="#b1b8cf" >相关资料</text><text x="388" y="495" font-size="26" font-weight="500" fill="#f0f1fa" >个人简历 · 岗位说明</text><text x="388" y="533" font-size="20" font-weight="400" fill="#b1b8cf" >已加入当前场景</text><rect x="366" y="588" width="460" height="158" rx="17" fill="#282d3e" stroke="none" /><g transform="translate(388 610) scale(0.9583333333333334)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="424" y="631" font-size="19" font-weight="400" fill="#b1b8cf" >经验与题库</text><text x="388" y="676" font-size="26" font-weight="500" fill="#f0f1fa" >跨团队项目复盘</text><text x="388" y="714" font-size="20" font-weight="400" fill="#b1b8cf" >先讲结论，再补充行动与结果</text><rect x="370" y="807" width="226" height="38" rx="19" fill="#35305a" stroke="none" /><text x="483" y="833" font-size="18" font-weight="500" fill="#b0a6ff" text-anchor="middle">只参考当前场景</text><g transform="translate(896 175) scale(1.0833333333333333)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="935" y="197" font-size="29" font-weight="500" fill="#f0f1fa" >建议回答</text><rect x="1316" y="169" width="164" height="38" rx="19" fill="#35305a" stroke="none" /><text x="1398" y="195" font-size="18" font-weight="500" fill="#b0a6ff" text-anchor="middle">当前场景</text><path d="M894 220H1482" stroke="#363c50"/><text x="900" y="266" font-size="23" font-weight="400" fill="#b1b8cf" >如何推动跨团队合作？</text><text x="900" y="335" font-size="30" font-weight="500" fill="#f0f1fa" >先对齐目标，再验证方案。</text><text x="900" y="393" font-size="25" font-weight="400" fill="#f0f1fa" >在项目初期，我会先明确共同的</text><text x="900" y="435" font-size="25" font-weight="400" fill="#f0f1fa" >业务目标，把不同意见拆成可比较的</text><text x="900" y="477" font-size="25" font-weight="400" fill="#f0f1fa" >方案与判断标准。</text><text x="900" y="555" font-size="24" font-weight="400" fill="#b1b8cf" >01   先听清各方真正关心的问题。</text><text x="900" y="607" font-size="24" font-weight="400" fill="#b1b8cf" >02   用小范围验证建立共同依据。</text><text x="900" y="659" font-size="24" font-weight="400" fill="#b1b8cf" >03   明确分工、节点和下一步行动。</text><rect x="896" y="755" width="222" height="38" rx="19" fill="#35305a" stroke="none" /><text x="1007" y="781" font-size="18" font-weight="500" fill="#b0a6ff" text-anchor="middle">简历 · 项目经历</text><rect x="1132" y="755" width="222" height="38" rx="19" fill="#282d3e" stroke="none" /><text x="1243" y="781" font-size="18" font-weight="500" fill="#b1b8cf" text-anchor="middle">经验 · 协作复盘</text><path d="M894 820H1482" stroke="#363c50"/><rect x="896" y="848" width="128" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="960" y="880" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">更简短</text><rect x="1038" y="848" width="108" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="1092" y="880" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">举例</text><rect x="1160" y="848" width="108" height="48" rx="24" fill="#282d3e" stroke="none" /><text x="1214" y="880" font-size="21" font-weight="500" fill="#b1b8cf" text-anchor="middle">STAR</text><rect x="1282" y="848" width="196" height="48" rx="24" fill="url(#accent)" stroke="none" /><text x="1380" y="880" font-size="21" font-weight="500" fill="#fff" text-anchor="middle">继续追问</text></g><text x="800" y="974" font-size="10" font-weight="500" fill="#a4a8b6" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#959aa9"/><path d="M653 988H947L933 1000H667Z" fill="#707584"/><path d="M62 1017H