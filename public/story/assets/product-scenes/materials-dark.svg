600" width="422" height="84" rx="14" fill="#252d40" stroke="none" /><g transform="translate(406 625) scale(1.0416666666666667)" fill="none" stroke="#b2bed5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="450" y="638" font-size="23" font-weight="500" fill="#f0f3fc" >项目复盘.md</text><text x="450" y="666" font-size="17" font-weight="400" fill="#b2bed5" >已加入当前场景</text><path d="M390 726H808" stroke="#343f55"/><g transform="translate(396 751) scale(1)" fill="none" stroke="#b9afff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="434" y="775" font-size="23" font-weight="500" fill="#f0f3fc" >回答技能</text><rect x="700" y="749" width="94" height="38" rx="19" fill="#353254" stroke="none" /><text x="747" y="775" font-size="18" font-weight="500" fill="#b9afff" text-anchor="middle">启用</text><text x="396" y="824" font-size="20" font-weight="400" fill="#b2bed5" >先讲结论 → 提供证据 → 下一步</text><text x="396" y="860" font-size="20" font-weight="400" fill="#b2bed5" >只应用于当前面试场景。</text><text x="884" y="383" font-size="27" font-weight="500" fill="#f0f3fc" >个人简历</text><rect x="1320" y="352" width="156" height="38" rx="19" fill="#252d40" stroke="none" /><text x="1398" y="378" font-size="18" font-weight="500" fill="#b2bed5" text-anchor="middle">全文</text><path d="M878 406H1480" stroke="#343f55"/><text x="886" y="455" font-size="30" font-weight="500" fill="#f0f3fc" >项目经历</text><rect x="882" y="488" width="594" height="92" rx="12" fill="#353254" stroke="none" /><text x="904" y="526" font-size="24" font-weight="400" fill="#f0f3fc" >跨团队协作平台设计</text><text x="904" y="562" font-size="24" font-weight="400" fill="#f0f3fc" >负责目标对齐、方案验证与交付推进。</text><text x="886" y="631" font-size="24" font-weight="500" fill="#f0f3fc" >过程与结果</text><text x="886" y="678" font-size="22" font-weight="400" fill="#b2bed5" >• 访谈业务、设计与研发，明确共同目标。</text><text x="886" y="726" font-siz