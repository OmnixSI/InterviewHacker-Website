ont-size="26" font-weight="400" fill="#b0a6ff" >＋</text><rect x="388" y="400" width="422" height="84" rx="14" fill="#35305a" stroke="none" /><g transform="translate(406 425) scale(1.0416666666666667)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="450" y="438" font-size="23" font-weight="500" fill="#f0f1fa" >个人简历.pdf</text><text x="450" y="466" font-size="17" font-weight="400" fill="#b1b8cf" >已解析 · 可用于回答</text><rect x="388" y="500" width="422" height="84" rx="14" fill="#282d3e" stroke="none" /><g transform="translate(406 525) scale(1.0416666666666667)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="450" y="538" font-size="23" font-weight="500" fill="#f0f1fa" >岗位说明.pdf</text><text x="450" y="566" font-size="17" font-weight="400" fill="#b1b8cf" >已加入当前场景</text><rect x="388" y="600" width="422" height="84" rx="14" fill="#282d3e" stroke="none" /><g transform="translate(406 625) scale(1.0416666666666667)" fill="none" stroke="#b1b8cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="450" y="638" font-size="23" font-weight="500" fill="#f0f1fa" >项目复盘.md</text><text x="450" y="666" font-size="17" font-weight="400" fill="#b1b8cf" >已加入当前场景</text><path d="M390 726H808" stroke="#363c50"/><g transform="translate(396 751) scale(1)" fill="none" stroke="#b0a6ff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g><text x="434" y="775" font-size="23" font-weight="500" fill="#f0f1fa" >回答技能</text><rect x="700" y="749" width="94" height="38" rx="19" fill="#35305a" stroke="none" /><text x="747" y="775" font-size="18" font-weight="500" fill="#b0a6ff" text-anchor="middle">启用</text><text x="396" y="824" font-size="20" font-weight="400" fill="#b1b8cf" >先讲结论 → 提供证据 → 下一步</text><text x="396" y="860" font-size="20" font-weight="400" fill="#b1b8cf" >只应用于当前面试场景。</text><text x="884" y="383" font-size="27" font-weight="500" fill="#f0f1fa" >个人简历</text><rect x="1320" y="352" width="156" height="38" rx="19" fill="#282d3e" stroke="none" /><text x="1398" y="378" font-size="18" font-weight="500" fill="#b1b8cf" text-anchor="middle">全文</text><path d="M878 406H1480" stroke="#363c50"/><text x="886" y="455" font-size="30" font-weight="500" fill="#f0f1fa" >项目经历</text><rect x="882" y="488" width="594" height="92" rx="12" fill="#35305a" stroke="none" /><text x="904" y="526" font-size="24" font-weight="400" fill="#f0f1fa" >跨团队协作平台设计</text><text x="904" y="562" font-size="24" font-weight="400" fill="#f0f1fa" >负责目标对齐、方案验证与交付推进。</text><text x="886" y="631" font-size="24" font-weight="500" fill="#f0f1fa" >过程与结果</text><text x="886" y="678" font-size="22" font-weight="400" fill="#b1b8cf" >• 访谈业务、设计与研发，明确共同目标。</text><text x="886" y="726" font-size="22" font-weight="400" fill="#b1b8cf" >• 用原型验证分歧，保留关键决策依据。</text><text x="886" y="774" font-size="22" font-weight="400" fill="#b1b8cf" >• 将复盘整理为下一次可复用的经验。</text><path d="M880 838H1480" stroke="#363c50"/><g transform="translate(886 860) scale(0.9583333333333334)" fill="none" stroke="#6ad9ae" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="924" y="881" font-size="21" font-weight="400" fill="#b1b8cf" >资料在本机解析与保存</text></g><text x="800" y="974" font-size="10" font-weight="500" fill="#a4a8b6" text-anchor="middle">I N T E R V I E W H A C K E R</text><path d="M18 988H1582L1546 1018Q1540 1026 1518 1026H82Q60 1026 54 1018Z" fill="url(#base)" stroke="#959aa9"/><path d="M653 988H947L933 1000H667Z" fill="#707584"/><path d="M62 1017H1538" stroke="#636978" opacity=".6"/></g></g></svg>
